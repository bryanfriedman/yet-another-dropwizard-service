name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository_owner }}/yads-demo-mod-copilot-base:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # NET_ADMIN/NET_RAW are needed for the Copilot agent firewall to set up
      # iptables rules inside the container without being disabled.
      # Workaround per https://github.com/orgs/community/discussions/170315
      #
      # Host paths like /home/runner/work/_temp/<action>/script/*.sh that the
      # Copilot harness hardcodes are resolved via the
      # /home/runner/work/_temp -> /__w/_temp symlink baked into the image, not
      # a bind-mount: --volume /home/runner:/home/runner shadows the symlink
      # with an empty host dir, since the runner stages ghcca-node and harness
      # scripts inside the container's _temp (/__w/_temp), not on the host.
      options: --cap-add=NET_ADMIN --cap-add=NET_RAW
    steps:
      # No actions/checkout here: the Copilot coding agent does its own clone
      # at session start, and JS-action checkout has been failing inside this
      # custom container due to /__w/_actions mount interactions with the
      # /home/runner bind-mount. Setup-steps doesn't need a working tree.

      # GitHub Actions sets HOME=/github/home for container jobs, but the image
      # baked everything into /root/.moderne. Expose it at $HOME so `mod` finds it.
      - name: Expose pre-baked Moderne config at $HOME
        run: |
          if [ ! -e "$HOME/.moderne" ]; then
            ln -s /root/.moderne "$HOME/.moderne"
          fi

      - name: Activate Moderne CLI with secrets
        run: |
          mod --version
          mod config moderne edit https://app.moderne.io
          mod config moderne login --with-token ${{ secrets.MODERNE_PLATFORM_PAT }}
          mod config license edit ${{ secrets.MODERNE_LICENSE_KEY_ALTERNATIVE }}
          mod config moderne show

      - name: Register Moderne MCP server with Copilot
        run: mod config agent-tools copilot install
