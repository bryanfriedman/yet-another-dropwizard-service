name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      AGENT_IMAGE: ghcr.io/${{ github.repository_owner }}/yads-demo-mod-copilot-base:latest
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage pre-baked Moderne CLI from image
        run: |
          docker pull "$AGENT_IMAGE"
          cid=$(docker create "$AGENT_IMAGE")
          docker cp "$cid:/root/.moderne" "$HOME/.moderne"
          docker rm "$cid"
          echo "$HOME/.moderne/cli/bin" >> "$GITHUB_PATH"

      - name: Activate Moderne CLI with secrets
        run: |
          mod --version
          mod config http trust-store edit file /etc/ssl/certs/adoptium/cacerts
          mod config moderne edit https://app.moderne.io
          mod config moderne login --with-token ${{ secrets.MODERNE_PLATFORM_PAT }}
          mod config license edit ${{ secrets.MODERNE_LICENSE_KEY_ALTERNATIVE }}
          mod config moderne show

      - name: Register Moderne MCP server with Copilot
        run: mod config agent-tools copilot install
